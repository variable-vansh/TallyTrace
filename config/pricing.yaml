# LLM pricing. The harness reports rupee cost per reconciled transaction, and this is
# where every rate behind that number comes from. Written before the first model call
# existed, so that adding a model and reading a cost were two changes rather than one.
#
# Anthropic first-party API rates, USD per million tokens.

model: claude-opus-5

usd_per_mtok:
  input: 5.00
  output: 25.00
  cache_read: 0.50            # ~0.1x input
  cache_write: 6.25           # ~1.25x input

# Conversion for the rupee-denominated cost metric. A rate, not a market quote:
# it is here so the number in the report is stated in one currency rather than
# silently mixing two.
usd_to_inr: 88.00

# Token estimate for cache entries whose usage was not metered by the HTTP API.
# Approximate, and labelled as approximate everywhere the number surfaces. The
# alternative -- recording zero -- would report a model-backed pipeline as free,
# which is a more misleading number than an approximate one.
estimated_chars_per_token: 3.6
