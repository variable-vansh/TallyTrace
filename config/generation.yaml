# The generation plan. Everything the synthetic world depends on lives here so that
# "how many troubles of which cause, worth how many rupees" is answerable by reading
# config rather than by reading code.

seed: 20250106
batch_count: 10
batch_length_days: 7
first_batch_start: 2025-01-06          # Monday

# Orders *settling* in each batch. Generation is driven from the settlement cycle
# rather than the order date: a batch is a settlement report, so this is what
# actually sets each batch's size. created_at is then derived backwards from the
# channel's lag, which produces the opening book (orders created before batch 1)
# for free and leaves nothing unsettled at the end of the corpus.
#
# These are calibrated, not guessed. Injectors move rows between batches -- a lagged
# settlement leaves its batch, an RTO reversal or a claim recovery arrives in a later
# one -- and refunded orders emit a second row. Batch 10 absorbs all the spillover and
# emits none, which is why its order count dips below batch 9's while its row count
# is still the largest. The resulting settlement-report row counts are:
#   59, 72, 85, 101, 114, 127, 141, 154, 167, 181
settlements_per_batch: [61, 73, 83, 89, 103, 117, 123, 134, 144, 122]

# Share of orders that are refunded/returned in the clean base (independent of the
# RTO reversal injector). Keeps the refund path exercised in clean data.
clean_refund_rate: 0.06

# Malformed rows written raw into the CSVs, bypassing the models, to exercise the
# quarantine path. batch -> list of corruption kinds.
malformed_rows:
  2: [missing_order_id]
  4: [unparseable_date]
  6: [amount_with_comma]
  8: [missing_order_id]
  9: [unparseable_date]

# ---------------------------------------------------------------------------
# The injection plan.
#
# recurring  : commission_rate_stale / rto_reversal_later_cycle /
#              refund_timing_lag / settlement_lag_crossing_batch appear in most
#              batches with a consistent signature. These are what the system learns.
# held out   : promo_cofunding_deduction first appears in batch 7,
#              chargeback_deduction first appears in batch 9. Nowhere earlier.
# one-offs   : 1-2 per batch with no consistent signature. These are why the review
#              rate plateaus above zero.
# near-miss  : surface signature of the myntra stale-rate rule, different true cause.
# ---------------------------------------------------------------------------
injections:
