# Tallytrace thresholds.
# Nothing in the codebase may hardcode any number that appears in this file.
# See spec/00-project-brief.md -> "Thresholds".

matching:
  rounding_tolerance_inr: 1.00
  date_window_days: 21
  fee_variance_tolerance_pct: 0.5
  # Bounds on the N:1 residual search. Deliberately small: the job is to name the
  # one or two rows a bank credit does not account for, not to solve subset-sum.
  subset_search:
    max_subset_size: 3
    max_candidates: 60

auto_resolution:
  # The default ceiling, in rupees of *error* -- not of order value. Above it, never
  # auto-resolve. The business owns this number; nothing in the code may assume it.
  #
  # Held at 500.00 against a proposal to raise it to 1000.00. The live precision the
  # product can see rises with the ceiling (98.63% -> 98.77%); the precision measured
  # against the answer key falls (98.63% -> 95.68%), because the marginal rows are ones
  # a rule and an operator get wrong in the same direction. `make ceilings` prints the
  # whole curve. See FAILURES.md #40.
  max_variance_inr: 500.00

  # Ceilings the business sets per cause and per channel, because one number is a
  # policy about the average case and there is no average case: a stale commission
  # rate on a website order is a different risk from a four-figure clawback on a
  # marketplace return.
  #
  #   - most specific match wins -- cause+channel beats cause or channel alone,
  #     which beats the default. File order is never consulted;
  #   - two equally specific ceilings that meet on one case (a cause and a channel,
  #     say) resolve to the *lower* one: both are your policy, neither is aimed more
  #     precisely, and a tie between risk thresholds goes to the stricter;
  #   - one scope, one number. The same scope set twice is a load error;
  #   - `max_variance_inr: 0.00` turns auto-resolution off for that scope entirely;
  #   - every override is named in the score report, in the decision path of every
  #     resolution it governs, and on the dashboard. A raised ceiling can be argued
  #     about; it cannot be invisible.
  #
  # Ships empty, so the shipped numbers are the shipped policy. To set one, uncomment
  # and edit -- `set_by` and `note` are recorded and shown beside the number:
  #
  #   max_variance_overrides:
  #     - cause: commission_rate_stale
  #       max_variance_inr: 1500.00
  #       set_by: finance.head@demostore.in
  #       note: A rate that moved is arithmetic we can check, not a dispute.
  #     - channel: offline
  #       max_variance_inr: 0.00
  #       set_by: finance.head@demostore.in
  #       note: Counter takings are counted by hand. Nothing here closes itself.
  max_variance_overrides: []

  never_auto_resolve_causes:        # regardless of rule confidence
    - tcs_timing_mismatch
    - tds_timing_mismatch
    - chargeback_deduction

rule_lifecycle:
  # Distinct operator demonstrations a candidate needs before it may enter shadow and
  # start predicting. Demonstrations, not rows: eighty rows cleared by one sentence is
  # one piece of evidence, and counting them as eighty is how a rule induced from a
  # single anecdote walks straight into the lifecycle wearing a perfect backtest.
  #
  # Set to 2 after running the corpus at 1, 2 and 3. The comparison is in RESULTS.md
  # and it is not the one that was expected: auto-resolution precision (98.63%), the
  # review-rate curve (100% -> 14.9%) and the number of cases closed (146) are
  # *identical* at all three. The gate does not move the outcome, because what a rule
  # is allowed to do is decided by the approval, the lifecycle and the guardrails
  # underneath it. What the gate moves is how much unsupported material reaches a
  # human: at 1 the operator is shown 77 candidates, at 2 they are shown 46, at 3
  # they are shown 34.
  #
  # 3 was the intended setting and was rejected on evidence. It delays the loose
  # rto_reversal rule into shadow at batch 3, after which ten batches are not long
  # enough for it to reach `retirement_min_observations` -- so nothing retires, and
  # "at least one rule retired itself" is a checkpoint-3 done condition and the
  # clearest evidence the lifecycle is real. Buying a shorter review queue by
  # deleting the demotion story is a bad trade.
  #
  # Lowering it to 1 does not loosen the gate, it removes it: a rule with one
  # demonstration backtests at 100% precision on the row it was induced from, by
  # construction, and 1 is the value at which zero candidates are ever discarded.
  min_support_demonstrations: 2

  promotion_min_confirmations: 3
  promotion_min_precision: 0.90
  retirement_precision_floor: 0.75
  retirement_min_observations: 5

  # Human overrides of an *active* rule before it is put back into shadow. This is a
  # different signal from the retirement floor above, and both exist on purpose:
  # retirement is slow statistical decay measured over `retirement_min_observations`,
  # demotion is fast human disagreement and is recoverable. A rule an operator has
  # corrected twice should stop acting this week, not once its precision has drifted
  # far enough to average out.
  #
  # Demotion returns a rule to shadow, where it keeps predicting and can earn its way
  # back through the ordinary promotion gate. The overrides that caused a demotion are
  # not counted again afterwards, or a rule would fall out of active the moment it was
  # promoted back.
  max_overrides_before_demotion: 2

claims:
  # The deadline policy, as data. One row per scope; adding a channel means adding a
  # row and never a code change. `rule` says what *kind* of clock it is, which is the
  # part that used to be a conditional in pipeline/claims/deadlines.py:
  #
  #   days_from_event    -- `value` is a duration in days from the day the claim opened
  #   day_of_next_month  -- `value` is a day *of the following month*, not a duration
  #
  # Most specific scope wins: a row naming a claim_type beats one naming only a
  # channel, so a TCS discrepancy on Flipkart runs on the GSTR-8 calendar rather than
  # borrowing Flipkart's 30-day commercial window. A scope with no row gets no clock
  # at all rather than a default -- inventing a countdown no agreement backs is the
  # one thing a claims queue cannot afford.
  deadline_policy:
    - channel: amazon
      rule: days_from_event
      value: 30
      note: SAFE-T claim window
    - channel: flipkart
      rule: days_from_event
      value: 30
    - channel: myntra
      rule: days_from_event
      value: 30
    - claim_type: tcs_timing_mismatch
      rule: day_of_next_month
      value: 10
      note: GSTR-8 correction must be raised before the 10th of the following month

  # Queue bucketing, in days remaining. Sized to the batch cadence rather than to
  # calendar intuition: batches are weekly, so a three-day red bucket would never be
  # observed -- a claim would pass from green to expired between two runs without ever
  # being shown as urgent. Red is one batch left, amber is two.
  buckets:
    red_within_days: 7
    amber_within_days: 14
